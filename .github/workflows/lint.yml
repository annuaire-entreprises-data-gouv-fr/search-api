name: Lint
permissions:
  contents: read
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
      - name: Set up Python
        run: uv python install
      # ruff and mypy come from the "dev" group of uv.lock, shared with pre-commit
      - name: Install dependencies
        run: uv sync --locked
      - name: Run Ruff
        run: uv run --no-sync ruff check --diff --output-format=github .
      - name: Run Mypy
        run: uv run --no-sync mypy app
