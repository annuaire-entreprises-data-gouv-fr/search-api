[project]
name = "search-api"
version = "1.0.0"
requires-python = "==3.12.8"
description = "Codebase of the L'Annuaire des Entreprises API to search for any French company and retrieve its details."
authors = [
    { name = "L'Annuaire des Entreprises", email = "annuaire-entreprises@data.gouv.fr" },
]
readme = "README.md"
license-files = ["LICENSE"]
dependencies = [
    "elastic-apm==6.26.2",
    "elasticsearch==9.3.0",
    "fastapi[standard]==0.141.1",
    "orjson==3.11.6",
    "pydantic==2.13.2",
    "pydantic-settings==2.15.0",
    "PyYAML==6.0.2",
    "redis==8.1.0",
    "requests==2.34.1",
    "sentry-sdk==2.69.1",
]

[dependency-groups]
# Used by the CI and by the pre-commit hooks through `uv run`
dev = [
    "mypy==1.19.1",
    "pytest==9.1.1",
    "ruff==0.16.0",
    "types-PyYAML",
    "types-requests",
]

[project.urls]
API = "https://recherche-entreprises.api.gouv.fr/"
Repository = "https://github.com/annuaire-entreprises-data-gouv-fr/search-api"
Website = "https://annuaire-entreprises.data.gouv.fr/"

[tool.ruff.lint]
ignore = ["TRY002", "BLE001", "RUF012"]
extend-select = ["I"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-vv"

[tool.mypy]
strict_optional = false
ignore_missing_imports = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]
exclude = ["^\\.venv/"]
